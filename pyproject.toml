[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests_homeassistant"]

[tool.coverage.run]
branch = true
source = ["custom_components/mnd_tariff_accounting"]

[tool.coverage.report]
show_missing = true
